# Every GPU service on the node, grouped into profiles (modes). The 16 GB GPU runs
# one mode at a time; switch with ./gpu-mode.sh, which stops everything first.
#   serve   chat model (vLLM, Qwen3-8B) + Open WebUI          → what rag-lab uses day to day
#   ingest  Docling + a vision model for figure descriptions  → converting new documents
# Commands and flags are the ones verified in vllm.md and docling.md.
#
# On the node: copy this folder to ~/serving/, create .env next to it with
#   TS_IP=<output of `tailscale ip -4`>
#   HF_CACHE=/home/<user>/.cache/huggingface
# HF_CACHE is spelled out because `sudo` sets HOME to /root, so ~ would point at
# root's (empty) cache and re-download every model.

# Fixed project name: containers and volumes (serving_open-webui) keep the same
# names wherever this folder lives.
name: serving

x-gpu: &gpu # gives a container the GPU, like `docker run --gpus all`
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-vllm-image: &vllm-image vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34

services:
  # --- serve -------------------------------------------------------------------
  vllm:
    profiles: [serve]
    container_name: vllm
    image: *vllm-image
    <<: *gpu
    ipc: host # PyTorch needs more shared memory than Docker's default
    ports:
      - "${TS_IP:?set TS_IP in .env}:8000:8000" # Tailscale address only
    volumes:
      - "${HF_CACHE:?set HF_CACHE in .env}:/root/.cache/huggingface"
    command:
      - --model=Qwen/Qwen3-8B-FP8
      - --max-model-len=8192
      - --gpu-memory-utilization=0.90
      - --enable-auto-tool-choice # Open WebUI sends tools with every chat
      - --tool-call-parser=hermes

  open-webui:
    profiles: [serve]
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${TS_IP}:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://${TS_IP}:8000/v1
      OPENAI_API_KEY: none
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui:/app/backend/data

  # --- ingest ------------------------------------------------------------------
  docling:
    profiles: [ingest]
    container_name: docling
    image: quay.io/docling-project/docling-serve-cu128:v1.37.0
    <<: *gpu
    ports:
      - "${TS_IP}:5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_SERVE_RESULT_REMOVAL_DELAY: "3600" # keep results an hour
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true" # allowed to call vllm-vision
    volumes:
      # Keeps the formula model (downloaded with docling-tools) across `down`.
      # TO VERIFY on the node: that this is the image's model folder.
      - docling-models:/opt/app-root/src/.cache/docling/models

  vllm-vision:
    profiles: [ingest]
    container_name: vllm-vision
    image: *vllm-image
    <<: *gpu
    ipc: host
    ports:
      - "${TS_IP}:8001:8000"
    volumes:
      - "${HF_CACHE}:/root/.cache/huggingface"
    command:
      - --model=Qwen/Qwen3-VL-4B-Instruct-FP8
      - --max-model-len=4096
      - --gpu-memory-utilization=0.70 # leaves ~4 GB for Docling next to it
      - --max-num-seqs=4
      - '--limit-mm-per-prompt={"image": 1}'

volumes:
  open-webui:
  docling-models:
