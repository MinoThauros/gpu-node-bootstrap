# Open WebUI (chat UI and document Q&A) in front of the vLLM container from vllm.md.
# vLLM stays a plain `docker run`; this stack reaches it on the Tailscale address.
# On the node: copy to ~/serving/, then
#   echo "TS_IP=$(tailscale ip -4)" > .env && sudo docker compose up -d

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${TS_IP:?set TS_IP in .env}:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://${TS_IP}:8000/v1
      OPENAI_API_KEY: none
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
