# RuntimeClass "nvidia": pods that set runtimeClassName: nvidia run under the NVIDIA container runtime,
# which k3s registers in containerd (handler "nvidia") when it finds nvidia-container-runtime on the node.
# Recent k3s servers create this same object themselves (server/manifests/runtimes.yaml);
# applying it again is harmless and keeps clusters on older k3s working.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
