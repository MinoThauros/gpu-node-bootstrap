# One-shot GPU smoke test: asks for 1 GPU, runs nvidia-smi, exits.
#   kubectl apply -f k3s/cluster/test/gpu-test-pod.yaml
#   kubectl logs gpu-test        # should print the nvidia-smi table
#   kubectl delete pod gpu-test
# CUDA 12.8 is the first release with Blackwell (RTX 50xx) support and runs on any driver >= 570.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: default
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.2-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
