# NVIDIA k8s-device-plugin, adapted from upstream deployments/static/nvidia-device-plugin.yml (v0.20.1):
#   https://github.com/NVIDIA/k8s-device-plugin/releases/tag/v0.20.1
# Changes from upstream:
#   - nodeSelector: only GPU nodes (label set by k3s/join-agent.sh)
#   - runtimeClassName: nvidia, because k3s keeps runc as the default runtime; without it the
#     plugin cannot see the GPU (NVML) and advertises no nvidia.com/gpu capacity
# Upgrade: bump the image tag below to a newer release and re-apply.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
        app.kubernetes.io/name: nvidia-device-plugin
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      runtimeClassName: nvidia
      tolerations:
        # Runs on GPU nodes even if they carry the optional nvidia.com/gpu taint (docs/join-cluster.md)
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Critical add-on: reserved priority so it is rescheduled after a failure
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
          env: []
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubelet-device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: kubelet-device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
